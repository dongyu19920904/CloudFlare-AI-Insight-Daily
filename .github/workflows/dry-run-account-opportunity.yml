name: Dry-run supply-driven account opportunity

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Asia/Shanghai date in YYYY-MM-DD; blank uses today"
        required: false
        type: string

concurrency:
  group: dry-run-account-opportunity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKER_BASE_URL: https://cloudflare-ai-lnsight-daily.sabrinamisan090.workers.dev

    steps:
      - name: Resolve target date
        id: target
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          target="${REQUESTED_DATE:-$(TZ=Asia/Shanghai date +%F)}"
          if ! [[ "$target" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Date must use YYYY-MM-DD"
            exit 1
          fi
          echo "date=$target" >> "$GITHUB_OUTPUT"

      - name: Generate without publishing
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          TEST_TRIGGER_SECRET: ${{ secrets.TEST_TRIGGER_SECRET }}
        run: |
          if [ -z "$TEST_TRIGGER_SECRET" ]; then
            echo "::error::TEST_TRIGGER_SECRET is not configured"
            exit 1
          fi

          curl --fail-with-body --silent --show-error --get \
            "${WORKER_BASE_URL}/testTriggerScheduledAccountOpportunity" \
            --data-urlencode "key=${TEST_TRIGGER_SECRET}" \
            --data-urlencode "date=${TARGET_DATE}" \
            --data-urlencode "dryRun=1" \
            --data-urlencode "stream=1" \
            --output account-opportunity-dry-run.ndjson

          python - <<'PY'
          import json
          from pathlib import Path

          events = []
          for line in Path("account-opportunity-dry-run.ndjson").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if line:
                  events.append(json.loads(line))

          final = next((event for event in reversed(events) if event.get("state") in {"success", "error"}), None)
          if not final or final.get("state") != "success" or not final.get("success"):
              raise SystemExit("Worker dry-run did not finish successfully")

          debug = final.get("debug") or {}
          expected = {
              "accountOpportunitySupplySnapshotLoaded": True,
              "accountOpportunitySupplyDriven": True,
              "accountOpportunityGenerated": True,
              "accountOpportunityValidationPassed": True,
              "accountOpportunityWouldPublish": True,
              "accountOpportunityPublished": False,
          }
          mismatches = [f"{key}={debug.get(key)!r}" for key, value in expected.items() if debug.get(key) != value]
          if mismatches:
              raise SystemExit("Dry-run contract failed: " + ", ".join(mismatches))
          if debug.get("accountOpportunityPipelineVersion") != "supply-merchant-daily-v2":
              raise SystemExit("Dry-run did not use supply-merchant-daily-v2")
          if debug.get("accountOpportunityModelCalls") != 0:
              raise SystemExit("Supply-driven generation unexpectedly used an AI model")

          markdown = debug.get("accountOpportunityDryRunMarkdown") or ""
          required = [
              "## 今日经营判断",
              "## 今日经营看板",
              "## 核心商品备货表",
              "## 今日异动与补货",
              "## 平台货源地图",
              "## 暂停接单与同类替代",
              "## 报价与利润纪律",
              "## 今日执行单",
              "https://supply.aivora.cn/card-products/",
              "https://supply.aivora.cn/profit-calculator?",
          ]
          missing = [item for item in required if item not in markdown]
          if missing:
              raise SystemExit("Dry-run Markdown is incomplete: " + ", ".join(missing))
          Path("account-opportunity-dry-run.md").write_text(markdown, encoding="utf-8")

          selected = debug.get("accountOpportunitySelectedSupplySignals") or []
          core = debug.get("accountOpportunityMerchantCoreProducts") or []
          if len(core) < 6:
              raise SystemExit(f"Merchant board is too narrow: {len(core)} core products")
          if len(set(core)) != len(core):
              raise SystemExit("Merchant board contains duplicate products")
          if (debug.get("accountOpportunityMerchantCategoryCount") or 0) < 4:
              raise SystemExit("Merchant market map covers fewer than four categories")
          if (debug.get("accountOpportunitySupplyProductCount") or 0) < len(core):
              raise SystemExit("Supply snapshot product board is incomplete")
          print(
              "Merchant daily dry-run passed: "
              f"offers={debug.get('accountOpportunitySupplyAvailableOfferCount')}, "
              f"products={len(core)}, signals={len(selected)}, model_calls=0"
          )
          PY

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-opportunity-dry-run-${{ steps.target.outputs.date }}
          path: |
            account-opportunity-dry-run.md
            account-opportunity-dry-run.ndjson
          if-no-files-found: warn
          retention-days: 7
