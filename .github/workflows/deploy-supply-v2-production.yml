name: Deploy Supply Radar V2 Production

run-name: Deploy Supply Radar V2 production ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact tested Aivora-Supply-Radar V2 commit SHA
        required: true
        type: string
      mode:
        description: Deploy Worker and promote, or promote the existing verified Worker
        required: true
        default: deploy-and-promote
        type: choice
        options:
          - deploy-and-promote
          - promote-existing

permissions:
  contents: read

concurrency:
  group: deploy-supply-radar-v2-production
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://supply.aivora.cn
  PRODUCTION_WORKER_URL: https://aivora-supply-radar-v2.sabrinamisan090.workers.dev
  PAGES_EDGE_URL: https://aivora-supply-radar-edge.pages.dev
  NEXT_PUBLIC_SITE_URL: https://supply.aivora.cn
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPPLY_V2_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPPLY_V2_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPPLY_V2_SUPABASE_SERVICE_ROLE_KEY }}
  ADMIN_PASSWORD: ${{ secrets.SUPPLY_V2_ADMIN_PASSWORD }}
  ADMIN_SESSION_SECRET: ${{ secrets.SUPPLY_V2_ADMIN_SESSION_SECRET }}
  LEGACY_RADAR_API_URL: https://aivora-supply-radar.sabrinamisan090.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate immutable release and configuration
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          SUPPLY_V2_PROJECT_REF: ${{ vars.SUPPLY_V2_PROJECT_REF }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full release SHA is required" >&2; exit 1; }
          required=(
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY ADMIN_PASSWORD ADMIN_SESSION_SECRET
            SUPPLY_V2_PROJECT_REF CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
          )
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || { echo "Required deployment configuration is missing: $key" >&2; exit 1; }
          done
          [[ "$NEXT_PUBLIC_SUPABASE_URL" == "https://${SUPPLY_V2_PROJECT_REF}.supabase.co" ]] || {
            echo "Supabase project reference and URL do not match" >&2
            exit 1
          }
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact V2 release
        uses: actions/checkout@v4
        with:
          repository: dongyu19920904/Aivora-Supply-Radar
          ref: ${{ steps.release.outputs.sha }}
          path: site
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/v2-web/pnpm-lock.yaml

      - name: Install exact release dependencies
        working-directory: site/v2-web
        run: pnpm install --frozen-lockfile

      - name: Verify and build exact production release
        if: ${{ inputs.mode == 'deploy-and-promote' }}
        working-directory: site/v2-web
        shell: bash
        run: |
          set -euo pipefail
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm build:cf:production

      - name: Deploy isolated V2 production Worker
        if: ${{ inputs.mode == 'deploy-and-promote' }}
        working-directory: site/v2-web
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/supply-v2-production-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n '{
            NEXT_PUBLIC_SUPABASE_ANON_KEY: env.NEXT_PUBLIC_SUPABASE_ANON_KEY,
            SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY,
            ADMIN_PASSWORD: env.ADMIN_PASSWORD,
            ADMIN_SESSION_SECRET: env.ADMIN_SESSION_SECRET
          }' > "$secrets_file"
          pnpm exec wrangler deploy \
            --config wrangler.production.toml \
            --secrets-file "$secrets_file" \
            --var "NEXT_PUBLIC_SITE_URL:$NEXT_PUBLIC_SITE_URL" \
            --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" \
            --var "LEGACY_RADAR_API_URL:$LEGACY_RADAR_API_URL" \
            --message "Supply Radar V2 production $RELEASE_SHA"

      - name: Verify V2 Worker before edge switch
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 18); do
            offers_status="$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/direct-offers.json" \
              --write-out '%{http_code}' "$PRODUCTION_WORKER_URL/api/products/chatgpt-plus/offers?limit=50&offset=0")"
            home_status="$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/direct-home.html" \
              --write-out '%{http_code}' "$PRODUCTION_WORKER_URL/")"
            if [[ "$offers_status" == 200 ]] && [[ "$home_status" == 200 ]] && \
              jq -e '(.items | length) == 50 and .pageInfo.total >= 1000' \
                "$RUNNER_TEMP/direct-offers.json" > /dev/null && \
              grep -F '爱窝啦·AI账号店' "$RUNNER_TEMP/direct-home.html" > /dev/null && \
              grep -F '<link rel="canonical" href="https://supply.aivora.cn' \
                "$RUNNER_TEMP/direct-home.html" > /dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          [[ "$ready" == true ]] || { echo "V2 production Worker did not become ready" >&2; exit 1; }

      - name: Switch Pages edge service binding to V2
        id: edge
        working-directory: site/pages-edge
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          edge_purge_token="$(openssl rand -hex 32)"
          echo "::add-mask::$edge_purge_token"
          echo "purge_token=$edge_purge_token" >> "$GITHUB_OUTPUT"
          node - "$RELEASE_SHA" "$edge_purge_token" <<'NODE'
          const fs = require('node:fs');
          const release = process.argv[2];
          const purgeToken = process.argv[3];
          const file = 'public/_worker.js';
          const source = fs.readFileSync(file, 'utf8');
          const versionPattern = /^const CACHE_VERSION = "[^"]+";$/m;
          const purgePattern = /^const CACHE_PURGE_TOKEN = "[^"]+";$/m;
          if (!versionPattern.test(source) || !purgePattern.test(source)) {
            throw new Error('Pages edge deployment markers are missing');
          }
          fs.writeFileSync(
            file,
            source
              .replace(versionPattern, `const CACHE_VERSION = "${release}";`)
              .replace(purgePattern, `const CACHE_PURGE_TOKEN = "${purgeToken}";`),
          );
          NODE
          grep -F "const CACHE_VERSION = \"$RELEASE_SHA\";" public/_worker.js > /dev/null
          ../v2-web/node_modules/.bin/wrangler pages deploy public \
            --project-name aivora-supply-radar-edge \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-message "Promote Supply Radar V2" \
            --commit-dirty=false

      - name: Purge obsolete Pages edge cache
        shell: bash
        env:
          EDGE_PURGE_TOKEN: ${{ steps.edge.outputs.purge_token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          purged=false
          for attempt in $(seq 1 18); do
            headers="$RUNNER_TEMP/pages-edge-release-headers.txt"
            release_status="$(curl --silent --show-error --max-time 30 \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
              "$PAGES_EDGE_URL/?release_probe=$RELEASE_SHA")"
            release_header="$(awk -F ': ' 'tolower($1) == "x-aivora-edge-release" { gsub("\r", "", $2); print $2 }' "$headers" | tail -1)"
            if [[ "$release_status" == 200 && "$release_header" == "$RELEASE_SHA" ]]; then
              purge_body="$RUNNER_TEMP/pages-edge-purge.json"
              purge_status="$(curl --silent --show-error --max-time 30 \
                --request POST \
                --header "x-aivora-cache-purge: $EDGE_PURGE_TOKEN" \
                --output "$purge_body" --write-out '%{http_code}' \
                "$PAGES_EDGE_URL/__aivora_release_cache_purge")"
              if [[ "$purge_status" == 200 ]] && jq -e '.success == true' "$purge_body" > /dev/null; then
                purged=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$purged" == true ]] || { echo "Pages edge release did not become purge-ready" >&2; exit 1; }

      - name: Verify production domain after edge switch
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/production-offers.json" \
              --write-out '%{http_code}' "$PRODUCTION_URL/api/products/chatgpt-plus/offers?limit=50&offset=0")"
            if [[ "$status" == 200 ]] && jq -e '(.items | length) == 50 and .pageInfo.total >= 1000' \
              "$RUNNER_TEMP/production-offers.json" > /dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          [[ "$ready" == true ]] || { echo "Production domain did not switch to V2" >&2; exit 1; }

          paths=(/ /card-products /channels /opportunities /opportunities/archive /opportunities/2026-09-01 /changes /official-prices /community /submit /sitemap.xml /robots.txt)
          for attempt in $(seq 1 6); do
            for path in "${paths[@]}"; do
              headers="$RUNNER_TEMP/production-headers-$attempt.txt"
              status="$(curl --silent --show-error --max-time 30 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL$path")"
              cache_state="$(awk -F ': ' 'tolower($1) == "x-aivora-edge-cache" { gsub("\\r", "", $2); print $2 }' "$headers" | tail -1)"
              [[ "$status" == 200 ]] || { echo "Production route $path returned HTTP $status on attempt $attempt" >&2; exit 1; }
              case "$cache_state" in
                HIT|MISS|BYPASS|STALE) ;;
                *) echo "Production route $path did not pass through the resilient V2 edge (state: ${cache_state:-missing})" >&2; exit 1 ;;
              esac
            done
          done
          curl --fail --silent --show-error --max-time 30 \
            --dump-header "$RUNNER_TEMP/production-home-headers.txt" \
            "$PRODUCTION_URL/" > "$RUNNER_TEMP/production-home.html"
          grep -F '爱窝啦·AI账号店' "$RUNNER_TEMP/production-home.html" > /dev/null
          grep -F '<link rel="canonical" href="https://supply.aivora.cn' "$RUNNER_TEMP/production-home.html" > /dev/null
          grep -F 'application/ld+json' "$RUNNER_TEMP/production-home.html" > /dev/null
          grep -Fi "x-aivora-edge-release: $RELEASE_SHA" "$RUNNER_TEMP/production-home-headers.txt" > /dev/null

          mapfile -t static_assets < <(
            grep -oE '/_next/static/[^" ]+\.(css|js)' "$RUNNER_TEMP/production-home.html" |
              sort -u |
              head -8
          )
          [[ "${#static_assets[@]}" -gt 0 ]] || { echo "Production HTML did not expose static assets" >&2; exit 1; }
          for asset in "${static_assets[@]}"; do
            headers="$RUNNER_TEMP/static-headers.txt"
            status="$(curl --silent --show-error --max-time 30 --dump-header "$headers" --output /dev/null \
              --write-out '%{http_code}' "$PRODUCTION_URL$asset")"
            content_type="$(awk -F ': ' 'tolower($1) == "content-type" { gsub("\\r", "", $2); print tolower($2) }' "$headers" | tail -1)"
            [[ "$status" == 200 ]] || { echo "Static asset $asset returned HTTP $status" >&2; exit 1; }
            case "$asset:$content_type" in
              *.css*:text/css*) ;;
              *.js*:application/javascript*|*.js*:text/javascript*) ;;
              *) echo "Static asset $asset returned unexpected content type: ${content_type:-missing}" >&2; exit 1 ;;
            esac
          done

          total="$(jq -r '.pageInfo.total' "$RUNNER_TEMP/production-offers.json")"
          {
            echo "### Supply Radar V2 production"
            echo "- Release: \`$RELEASE_SHA\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- URL: \`$PRODUCTION_URL\`"
            echo "- ChatGPT Plus live offers: \`$total\`"
            echo "- Rollback service: \`aivora-supply-radar\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back Pages edge to V1 when post-switch verification fails
        if: ${{ failure() && steps.edge.outcome == 'success' }}
        working-directory: site/pages-edge
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          edge_purge_token="$(openssl rand -hex 32)"
          sed -i "s/^const CACHE_VERSION = .*/const CACHE_VERSION = \"$RELEASE_SHA-rollback-v1\";/" public/_worker.js
          sed -i "s/^const CACHE_PURGE_TOKEN = .*/const CACHE_PURGE_TOKEN = \"$edge_purge_token\";/" public/_worker.js
          grep -F "const CACHE_VERSION = \"$RELEASE_SHA-rollback-v1\";" public/_worker.js > /dev/null
          jq '.services[0].service = "aivora-supply-radar"' wrangler.jsonc > wrangler.rollback.jsonc
          mv wrangler.rollback.jsonc wrangler.jsonc
          ../v2-web/node_modules/.bin/wrangler pages deploy public \
            --project-name aivora-supply-radar-edge \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-message "Automatic rollback to Supply Radar V1" \
            --commit-dirty=false
          rollback_release="$RELEASE_SHA-rollback-v1"
          purged=false
          for attempt in $(seq 1 18); do
            headers="$RUNNER_TEMP/pages-edge-rollback-headers.txt"
            release_status="$(curl --silent --show-error --max-time 30 \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
              "$PAGES_EDGE_URL/?rollback_probe=$rollback_release")"
            release_header="$(awk -F ': ' 'tolower($1) == "x-aivora-edge-release" { gsub("\r", "", $2); print $2 }' "$headers" | tail -1)"
            if [[ "$release_status" == 200 && "$release_header" == "$rollback_release" ]]; then
              purge_body="$RUNNER_TEMP/pages-edge-rollback-purge.json"
              purge_status="$(curl --silent --show-error --max-time 30 \
                --request POST \
                --header "x-aivora-cache-purge: $edge_purge_token" \
                --output "$purge_body" --write-out '%{http_code}' \
                "$PAGES_EDGE_URL/__aivora_release_cache_purge")"
              if [[ "$purge_status" == 200 ]] && jq -e '.success == true' "$purge_body" > /dev/null; then
                purged=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$purged" == true ]] || { echo "Rollback edge release did not become purge-ready" >&2; exit 1; }
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 20 \
              "$PRODUCTION_URL/api/v1/health" > "$RUNNER_TEMP/rollback-health.json" && \
              jq -e '.status == "ok" and .database == "ok"' "$RUNNER_TEMP/rollback-health.json" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Automatic V1 edge rollback could not be verified" >&2
          exit 1
