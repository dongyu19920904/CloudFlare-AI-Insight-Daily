name: Inspect Daily Content Payload
on:
  workflow_dispatch:
    inputs:
      date:
        description: inspect date
        required: true
        default: "2026-03-11"
      diagnostics_only:
        description: "Read one Worker response status without model calls or publication"
        type: boolean
        default: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TARGET_DATE: ${{ inputs.date }}
    steps:
      - name: Inspect Worker HTTP status without changing data
        if: inputs.diagnostics_only
        run: |
          python - <<'PY'
          import json,os,re,urllib.request,urllib.error
          date=os.environ['TARGET_DATE']
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',date):
              raise SystemExit('Invalid date')
          url=f'https://cloudflare-ai-lnsight-daily.sabrinamisan090.workers.dev/getContent?date={date}'
          try:
              try:
                  response=urllib.request.urlopen(url,timeout=30)
              except urllib.error.HTTPError as error:
                  response=error
              with response:
                  status=response.code
                  content_type=response.headers.get('content-type','')
                  body=response.read(2048).decode('utf-8',errors='replace')
                  row={'url':url,'status':status,'contentType':content_type,
                       'cfRay':response.headers.get('cf-ray'),
                       'retryAfter':response.headers.get('retry-after'),
                       'date':response.headers.get('date')}
                  if status>=400 and 'application/json' not in content_type:
                      row['errorExcerpt']=re.sub(r'<[^>]*>',' ',body).strip()[:500]
          except Exception as error:
              row={'url':url,'networkError':type(error).__name__}
          with open('worker-http-status.json','w') as handle:
              json.dump(row,handle,ensure_ascii=False,indent=2)
          print(json.dumps(row,ensure_ascii=False))
          PY
      - name: Fetch content payload
        if: ${{ !inputs.diagnostics_only }}
        run: |
          set -euo pipefail
          DATE='${{ github.event.inputs.date }}'
          URL="https://cloudflare-ai-lnsight-daily.sabrinamisan090.workers.dev/getContent?date=${DATE}"
          curl --max-time 45 -fsSL "$URL" > payload.json
          python - <<'PY'
          import json,re
          with open('payload.json','r',encoding='utf-8') as f:
              data=json.load(f)
          print('TOP_LEVEL_KEYS', sorted(data.keys()))
          for key, items in data.items():
              if not isinstance(items, list):
                  continue
              media = 0
              examples = []
              for item in items:
                  html = ((item.get('details') or {}).get('content_html') or '')
                  if re.search(r'<img\\b|<video\\b', html, re.I):
                      media += 1
                      if len(examples) < 3:
                          examples.append(item.get('title','')[:120])
              print(f'{key}: total={len(items)} media={media} examples={examples}')
              for item in items:
                  if 'muse-wonder' in str(item.get('url','')):
                      print('META_SOURCE_ITEM', json.dumps(item, ensure_ascii=False))
          PY
      - name: Verify published edition without writing
        if: ${{ !inputs.diagnostics_only }}
        run: |
          python - <<'PY'
          import json,re,urllib.request
          date='${{ inputs.date }}'
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',date):
              raise SystemExit('Invalid date')
          rows=[]
          for url in ['https://news.aivora.cn/',f'https://news.aivora.cn/{date[:7]}/{date}/']:
              with urllib.request.urlopen(url,timeout=25) as response:
                  html=response.read().decode('utf-8')
                  rows.append({'url':url,'status':response.status,'figures':len(re.findall(r'<figure\b[^>]*ai-daily-figure',html)),
                    'metaCorrected':'面向个人与专业智能体' in html,'wrongMusic':'Meta 的音乐 AI' in html})
          with open('public-check.json','w') as f:
              json.dump(rows,f,ensure_ascii=False,indent=2)
          print(json.dumps(rows,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: daily-source-evidence
          path: |
            payload.json
            public-check.json
            worker-http-status.json
          retention-days: 3
