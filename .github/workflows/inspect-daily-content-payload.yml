name: Inspect Daily Content Payload
on:
  workflow_dispatch:
    inputs:
      date:
        description: inspect date
        required: true
        default: "2026-03-11"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch content payload
        run: |
          set -euo pipefail
          DATE='${{ github.event.inputs.date }}'
          URL="https://cloudflare-ai-lnsight-daily.sabrinamisan090.workers.dev/getContent?date=${DATE}"
          curl --max-time 45 -fsSL "$URL" > payload.json
          python - <<'PY'
          import json,re
          with open('payload.json','r',encoding='utf-8') as f:
              data=json.load(f)
          print('TOP_LEVEL_KEYS', sorted(data.keys()))
          for key, items in data.items():
              if not isinstance(items, list):
                  continue
              media = 0
              examples = []
              for item in items:
                  html = ((item.get('details') or {}).get('content_html') or '')
                  if re.search(r'<img\\b|<video\\b', html, re.I):
                      media += 1
                      if len(examples) < 3:
                          examples.append(item.get('title','')[:120])
              print(f'{key}: total={len(items)} media={media} examples={examples}')
              for item in items:
                  if 'muse-wonder' in str(item.get('url','')):
                      print('META_SOURCE_ITEM', json.dumps(item, ensure_ascii=False))
          PY
      - name: Verify published edition without writing
        run: |
          python - <<'PY'
          import json,re,urllib.request
          date='${{ inputs.date }}'
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',date):
              raise SystemExit('Invalid date')
          rows=[]
          for url in ['https://news.aivora.cn/',f'https://news.aivora.cn/{date[:7]}/{date}/']:
              with urllib.request.urlopen(url,timeout=25) as response:
                  html=response.read().decode('utf-8')
                  rows.append({'url':url,'status':response.status,'figures':len(re.findall(r'<figure\b[^>]*ai-daily-figure',html)),
                    'metaCorrected':'面向个人与专业智能体' in html,'wrongMusic':'Meta 的音乐 AI' in html})
          with open('public-check.json','w') as f:
              json.dump(rows,f,ensure_ascii=False,indent=2)
          print(json.dumps(rows,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: daily-source-evidence
          path: |
            payload.json
            public-check.json
          retention-days: 3
