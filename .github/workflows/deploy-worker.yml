name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
      - ".github/scripts/probe-model-line.mjs"
  workflow_dispatch:
    inputs:
      sync_bioai:
        description: "Also update and verify BioAI Anthropic bindings"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify both configured models before changing production
        env:
          AI_PROVIDER_API_KEY: ${{ secrets.RUNTOKEN_API_KEY }}
        run: node .github/scripts/probe-model-line.mjs direct

      - name: Deploy to Cloudflare Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_PROVIDER_API_KEY: ${{ secrets.RUNTOKEN_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/worker-ai-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n '{ANTHROPIC_API_KEY:env.AI_PROVIDER_API_KEY,ANTHROPIC_BACKUP_API_KEY:env.AI_PROVIDER_API_KEY}' > "$secrets_file"
          npx --yes wrangler@4.127.1 deploy --secrets-file "$secrets_file"

      - name: Verify deployed Worker model bindings without publishing a daily
        env:
          TEST_TRIGGER_SECRET: ${{ secrets.TEST_TRIGGER_SECRET }}
        run: node .github/scripts/probe-model-line.mjs worker

      - name: Checkout BioAI Worker
        if: github.event_name == 'workflow_dispatch' && inputs.sync_bioai
        uses: actions/checkout@v6
        with:
          repository: dongyu19920904/CloudFlare-BioAI-Daily
          ref: main
          path: bioai-worker

      - name: Deploy BioAI with compact bindings and enterprise Claude secrets
        if: github.event_name == 'workflow_dispatch' && inputs.sync_bioai
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_PROVIDER_API_KEY: ${{ secrets.RUNTOKEN_API_KEY }}
          TEST_TRIGGER_SECRET: ${{ secrets.TEST_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          grep -q '^ANTHROPIC_API_BASE_URL = "https://www.runtoken.ai"$' bioai-worker/wrangler.toml
          grep -q '^DEFAULT_ANTHROPIC_MODEL = "claude-sonnet-5"$' bioai-worker/wrangler.toml
          grep -q '^DEFAULT_ANTHROPIC_BACKUP_MODEL = "claude-opus-4-8"$' bioai-worker/wrangler.toml

          secrets_file="$RUNNER_TEMP/bioai-worker-ai-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n '{ANTHROPIC_API_KEY:env.AI_PROVIDER_API_KEY,ANTHROPIC_BACKUP_API_KEY:env.AI_PROVIDER_API_KEY,TEST_TRIGGER_SECRET:env.TEST_TRIGGER_SECRET}' > "$secrets_file"
          cd bioai-worker
          npx --yes wrangler@4.127.1 deploy --secrets-file "$secrets_file"

      - name: Verify BioAI deployed model path without publishing a daily
        if: github.event_name == 'workflow_dispatch' && inputs.sync_bioai
        shell: bash
        env:
          TEST_TRIGGER_SECRET: ${{ secrets.TEST_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          for route in primary backup; do
            if [[ "$route" == "primary" ]]; then
              expected_model="claude-sonnet-5"
            else
              expected_model="claude-opus-4-8"
            fi
            response="$(curl --fail --silent --show-error --max-time 30 -X POST \
              -H "x-test-trigger-secret: ${TEST_TRIGGER_SECRET}" \
              "https://cloudflare-bioai-daily.sabrinamisan090.workers.dev/testModelConnection?route=${route}")"
            if ! jq -e --arg route "$route" --arg model "$expected_model" \
              '.ok == true and .route == $route and .requestedModel == $model' <<<"$response" >/dev/null; then
              jq -c '{ok,route,requestedModel,error,milliseconds}' <<<"$response" >&2
              exit 1
            fi
            jq -c '{ok,route,requestedModel,milliseconds}' <<<"$response"
          done
