name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
      - ".github/scripts/probe-model-line.mjs"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify both configured models before changing production
        env:
          AI_PROVIDER_API_KEY: ${{ secrets.RUNTOKEN_API_KEY }}
        run: node .github/scripts/probe-model-line.mjs direct

      - name: Deploy to Cloudflare Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_PROVIDER_API_KEY: ${{ secrets.RUNTOKEN_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/worker-ai-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n '{ANTHROPIC_API_KEY:env.AI_PROVIDER_API_KEY,ANTHROPIC_BACKUP_API_KEY:env.AI_PROVIDER_API_KEY}' > "$secrets_file"
          npx --yes wrangler@4.127.1 deploy --secrets-file "$secrets_file"

      - name: Verify deployed Worker model bindings without publishing a daily
        env:
          TEST_TRIGGER_SECRET: ${{ secrets.TEST_TRIGGER_SECRET }}
        run: node .github/scripts/probe-model-line.mjs worker

      - name: Checkout BioAI backend
        uses: actions/checkout@v6
        with:
          repository: dongyu19920904/CloudFlare-BioAI-Daily
          ref: main
          path: bioai

      - name: Deploy BioAI Worker with the same Anthropic line
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_PROVIDER_API_KEY: ${{ secrets.RUNTOKEN_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/bioai-worker-ai-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n '{ANTHROPIC_API_KEY:env.AI_PROVIDER_API_KEY,ANTHROPIC_BACKUP_API_KEY:env.AI_PROVIDER_API_KEY}' > "$secrets_file"
          npx --yes wrangler@4.127.1 deploy --cwd bioai --secrets-file "$secrets_file"

      - name: Verify BioAI deployed model path without publishing a daily
        shell: bash
        run: |
          set -euo pipefail
          payload='{"projectId":"epiage-skill","role":"indie-developer","direction":"education","timeBudget":"two-hours","experience":"beginner","deployment":"no-deploy","goal":"验证模型连接，不处理个人数据"}'
          response="$(curl --fail --silent --show-error --max-time 45 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            'https://cloudflare-bioai-daily.sabrinamisan090.workers.dev/api/project-lab/aging-clock-plan')"
          result_source="$(jq -r '.resultSource // empty' <<<"$response")"
          if [[ "$result_source" != "model" && "$result_source" != "backup-model" ]]; then
            echo "BioAI model verification did not use a configured model."
            exit 1
          fi
          echo "BioAI model verification succeeded via: $result_source"
