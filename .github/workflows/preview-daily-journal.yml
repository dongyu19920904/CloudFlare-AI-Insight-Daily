name: Preview Daily Journal Without Publishing

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to preview (YYYY-MM-DD)"
        required: true
      refresh_sources:
        description: "Refresh today's cached source categories before preview"
        type: boolean
        default: false
      faq_only:
        description: "Preview only FAQ against the published edition; never publish or regenerate news"
        type: boolean
        default: false
      media_only:
        description: "Read-only original-source media preview against published prose; no model calls"
        type: boolean
        default: false
      source_grounding:
        description: "Run this branch's complete daily code with read-only cached sources; never publish"
        type: boolean
        default: false

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKER_BASE_URL: https://cloudflare-ai-lnsight-daily.sabrinamisan090.workers.dev
      TARGET_DATE: ${{ inputs.date }}
      TEST_TRIGGER_SECRET: ${{ secrets.TEST_TRIGGER_SECRET }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ inputs.faq_only || inputs.media_only || inputs.source_grounding }}
      - uses: actions/setup-node@v4
        if: ${{ inputs.faq_only || inputs.media_only || inputs.source_grounding }}
        with:
          node-version: 22
      - name: Preview only the optional FAQ
        if: ${{ inputs.faq_only && !inputs.media_only && !inputs.source_grounding }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.RUNTOKEN_API_KEY }}
        run: node scripts/preview-daily-faq.mjs
      - name: Preview only source media
        if: ${{ inputs.media_only && !inputs.source_grounding }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/preview-daily-media.mjs
      - name: Run complete branch code without production writes
        if: ${{ inputs.source_grounding }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.RUNTOKEN_API_KEY }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json,tomllib
          with open('wrangler.toml','rb') as f:
              config=tomllib.load(f)
          with open('artifacts/worker-vars.json','w') as f:
              json.dump(config['vars'],f)
          PY
          npx --yes esbuild@0.25.12 src/handlers/scheduled.js --bundle --platform=node --format=esm --outfile=artifacts/scheduled-dry-run.mjs
          node scripts/preview-daily-grounding.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.source_grounding }}
        with:
          name: daily-grounding-preview
          path: artifacts/grounding-preview
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.media_only }}
        with:
          name: media-only-preview
          path: artifacts/media-only
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.faq_only }}
        with:
          name: faq-only-preview
          path: artifacts/faq-only
          retention-days: 7
      - name: Refresh source categories
        if: ${{ inputs.refresh_sources && !inputs.faq_only && !inputs.media_only && !inputs.source_grounding }}
        shell: bash
        run: |
          set -euo pipefail
          for category in news project paper socialMedia; do
            curl --fail --silent --show-error -G "${WORKER_BASE_URL}/testFetchCategory" \
              --data-urlencode "key=${TEST_TRIGGER_SECRET}" \
              --data-urlencode "date=${TARGET_DATE}" \
              --data-urlencode "category=${category}" \
              -o "prefetch-${category}.json"
            python - "$category" <<'PY'
          import json
          import sys
          with open(f'prefetch-{sys.argv[1]}.json', encoding='utf-8') as handle:
              result = json.load(handle)
          if not result.get('success'):
              raise SystemExit(f'{sys.argv[1]} source refresh failed: {result}')
          print(f'{sys.argv[1]} refreshed')
          PY
          done
      - name: Generate a dry-run preview
        if: ${{ !inputs.faq_only && !inputs.media_only && !inputs.source_grounding }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ -z "$TEST_TRIGGER_SECRET" ]; then
            echo "::error::A valid date and TEST_TRIGGER_SECRET are required."
            exit 1
          fi
          curl --fail --silent --show-error --no-buffer --max-time 900 -G \
            "${WORKER_BASE_URL}/testTriggerScheduledDaily" \
            --data-urlencode "key=${TEST_TRIGGER_SECRET}" \
            --data-urlencode "date=${TARGET_DATE}" \
            --data-urlencode "dryRun=1" \
            --data-urlencode "stream=1" \
            -o preview.ndjson
          python - <<'PY'
          import json

          with open('preview.ndjson', encoding='utf-8') as handle:
              events = [json.loads(line) for line in handle if line.strip()]
          result = events[-1] if events else {}
          debug = result.get('debug') or {}
          print(json.dumps({
              'state': result.get('state'),
              'date': result.get('date'),
              'dailyWouldPublish': debug.get('dailyWouldPublish'),
              'dailyValidationIssues': debug.get('dailyValidationIssues'),
              'promptSelectedItems': debug.get('promptSelectedItems'),
              'promptSelectionDiagnostics': debug.get('promptSelectionDiagnostics'),
              'dailyPromptAllocation': debug.get('dailyPromptAllocation'),
              'dailyTopEligiblePromptItems': debug.get('dailyTopEligiblePromptItems'),
              'dailyShopCatalogVerified': debug.get('dailyShopCatalogVerified'),
              'dailyShopRelevantTopics': debug.get('dailyShopRelevantTopics'),
              'dailyShopCandidateTopics': debug.get('dailyShopCandidateTopics'),
              'dailyShopCatalogError': debug.get('dailyShopCatalogError'),
              'dailyFaqSeparateGenerationAttempted': debug.get('dailyFaqSeparateGenerationAttempted'),
              'dailyFaqSeparateGenerationRejectedIssues': debug.get('dailyFaqSeparateGenerationRejectedIssues'),
              'dailyFaqSeparateGenerationError': debug.get('dailyFaqSeparateGenerationError'),
              'dailyFaqSeparateGenerationInserted': debug.get('dailyFaqSeparateGenerationInserted'),
              'dailyFaqRejectedDraft': debug.get('dailyFaqRejectedDraft'),
              'dailyFunSeparateGenerationAttempted': debug.get('dailyFunSeparateGenerationAttempted'),
              'dailyFunSeparateCandidateItems': debug.get('dailyFunSeparateCandidateItems'),
              'dailyFunSeparateGenerationValid': debug.get('dailyFunSeparateGenerationValid'),
              'dailyFunRejectedDraft': debug.get('dailyFunRejectedDraft'),
              'dailyFunSeparateGenerationInserted': debug.get('dailyFunSeparateGenerationInserted'),
              'dailyFunSeparateGenerationError': debug.get('dailyFunSeparateGenerationError'),
              'dailyFunSectionPresent': debug.get('dailyFunSectionPresent'),
          }, ensure_ascii=False, indent=2))
          print('--- DAILY PREVIEW MARKDOWN ---')
          print(debug.get('dailyPreviewMarkdown') or '')
          if result.get('state') != 'success' or not debug.get('dailyWouldPublish'):
              raise SystemExit(result.get('error') or 'Daily preview failed validation')
          PY
