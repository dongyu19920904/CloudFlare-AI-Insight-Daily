name: Deploy Supply Radar V2 Preview

run-name: Deploy Supply Radar V2 preview ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact Aivora-Supply-Radar V2 commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-supply-radar-v2-preview
  cancel-in-progress: false

env:
  PREVIEW_URL: https://aivora-supply-radar-v2-preview.sabrinamisan090.workers.dev
  NEXT_PUBLIC_SITE_URL: https://aivora-supply-radar-v2-preview.sabrinamisan090.workers.dev
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPPLY_V2_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPPLY_V2_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPPLY_V2_SUPABASE_SERVICE_ROLE_KEY }}
  ADMIN_PASSWORD: ${{ secrets.SUPPLY_V2_ADMIN_PASSWORD }}
  ADMIN_SESSION_SECRET: ${{ secrets.SUPPLY_V2_ADMIN_SESSION_SECRET }}
  LEGACY_RADAR_API_URL: https://supply.aivora.cn

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate immutable release and configuration
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          SUPPLY_V2_PROJECT_REF: ${{ vars.SUPPLY_V2_PROJECT_REF }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full release SHA is required" >&2; exit 1; }
          required=(
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY ADMIN_PASSWORD ADMIN_SESSION_SECRET
            SUPPLY_V2_PROJECT_REF CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
          )
          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || { echo "Required deployment configuration is missing: $key" >&2; exit 1; }
          done
          [[ "$NEXT_PUBLIC_SUPABASE_URL" == "https://${SUPPLY_V2_PROJECT_REF}.supabase.co" ]] || {
            echo "Supabase project reference and URL do not match" >&2
            exit 1
          }
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact V2 release
        uses: actions/checkout@v4
        with:
          repository: dongyu19920904/Aivora-Supply-Radar
          ref: ${{ steps.release.outputs.sha }}
          path: site
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/v2-web/pnpm-lock.yaml

      - name: Verify and build exact release
        working-directory: site/v2-web
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm build:cf:preview

      - name: Deploy one isolated preview Worker version
        working-directory: site/v2-web
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/supply-v2-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n '{
            NEXT_PUBLIC_SUPABASE_ANON_KEY: env.NEXT_PUBLIC_SUPABASE_ANON_KEY,
            SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY,
            ADMIN_PASSWORD: env.ADMIN_PASSWORD,
            ADMIN_SESSION_SECRET: env.ADMIN_SESSION_SECRET
          }' > "$secrets_file"
          pnpm exec wrangler deploy \
            --config wrangler.preview.toml \
            --secrets-file "$secrets_file" \
            --var "NEXT_PUBLIC_SITE_URL:$NEXT_PUBLIC_SITE_URL" \
            --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" \
            --var "LEGACY_RADAR_API_URL:$LEGACY_RADAR_API_URL" \
            --message "Supply Radar V2 preview $RELEASE_SHA"

      - name: Verify preview routes, metadata and real data
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 30 \
              "$PREVIEW_URL/api/products/chatgpt-plus/offers?limit=50&offset=0" \
              > "$RUNNER_TEMP/chatgpt-plus.json"; then
              if jq -e '(.items | length) == 50 and .pageInfo.total >= 1000 and .pageInfo.hasMore == true' \
                "$RUNNER_TEMP/chatgpt-plus.json" > /dev/null; then
                ready=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$ready" == true ]] || { echo "V2 preview did not become ready with real data" >&2; exit 1; }

          paths=(/ /card-products /channels /opportunities /changes /official-prices /community /submit /sitemap.xml /robots.txt)
          for path in "${paths[@]}"; do
            curl --fail --silent --show-error --max-time 30 "$PREVIEW_URL$path" > /dev/null
          done
          curl --fail --silent --show-error --max-time 30 "$PREVIEW_URL/" > "$RUNNER_TEMP/v2-home.html"
          grep -F '爱窝啦·AI账号店' "$RUNNER_TEMP/v2-home.html" > /dev/null
          grep -F "<link rel=\"canonical\" href=\"$PREVIEW_URL" "$RUNNER_TEMP/v2-home.html" > /dev/null
          grep -F 'application/ld+json' "$RUNNER_TEMP/v2-home.html" > /dev/null

          total="$(jq -r '.pageInfo.total' "$RUNNER_TEMP/chatgpt-plus.json")"
          {
            echo "### Supply Radar V2 preview"
            echo "- Release: \`$RELEASE_SHA\`"
            echo "- URL: \`$PREVIEW_URL\`"
            echo "- ChatGPT Plus live offers: \`$total\`"
            echo "- Production domain changed: \`no\`"
          } >> "$GITHUB_STEP_SUMMARY"
