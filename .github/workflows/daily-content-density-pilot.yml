name: One-off daily content density pilot
# Targeted replay after source-event deduplication and evidence-density corrections.
on:
  push:
    branches: [codex/daily-content-density-20260918]
    paths: [.github/workflows/daily-content-density-pilot.yml]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_TRIGGER_SECRET: ${{ secrets.TEST_TRIGGER_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed-date source cache
        run: |
          mkdir -p pilot
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          base = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID']
          headers = {'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']}
          manifest = {}
          for kind in ('news', 'project', 'paper', 'socialMedia'):
              key = '2026-09-18-' + kind
              url = base + '/storage/kv/namespaces/bd98e664917441a08118edc88790bf3f/values/' + key
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  raw = response.read()
              data = json.loads(raw)
              assert isinstance(data, list), 'Fixed-date cache missing: ' + key
              manifest[kind] = {'items': len(data), 'sha256': hashlib.sha256(raw).hexdigest()}
          Path('pilot/cache-manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest))
          PY
      - name: Upload isolated version without moving production traffic
        run: |
          npx --yes wrangler@4.59.2 versions upload --preview-alias content-density-20260918 --message '2026-09-18 content density dry-run; no production rollout' > pilot/version-upload.log 2>&1
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('pilot/version-upload.log').read_text()
          match = re.search(r'Version Preview URL:\s*(https://[^\s]+)', log)
          assert match, 'No immutable version preview URL returned'
          Path('pilot/version-url.txt').write_text(match.group(1))
          print('Version preview URL:', match.group(1))
          PY
      - name: Generate one unpublished edition from the cached sample
        run: |
          PREVIEW_URL=$(cat pilot/version-url.txt)
          set +e
          curl --fail-with-body --silent --show-error --max-time 600 --get \
            "${PREVIEW_URL}/testTriggerScheduledDaily" \
            --data-urlencode "key=${TEST_TRIGGER_SECRET}" \
            --data-urlencode 'date=2026-09-18' \
            --data-urlencode 'dryRun=1' \
            --data-urlencode 'stream=1' \
            --output pilot/result.ndjson
          STREAM_EXIT=$?
          set -e
          echo "Preview stream exit code: ${STREAM_EXIT}; checking saved run status if needed."
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path
          events = [json.loads(line) for line in Path('pilot/result.ndjson').read_text().splitlines() if line.strip()]
          final = next((item for item in reversed(events) if item.get('state') in ('success', 'error')), {})
          if not final:
              base = Path('pilot/version-url.txt').read_text().strip()
              query = urllib.parse.urlencode({'key': os.environ['TEST_TRIGGER_SECRET'], 'date': '2026-09-18', 'mode': 'daily'})
              for attempt in range(20):
                  try:
                      with urllib.request.urlopen(base + '/testTriggerScheduledStatus?' + query, timeout=20) as response:
                          final = (json.load(response).get('status') or {})
                  except Exception as exc:
                      print('Status read failed:', type(exc).__name__)
                  if final.get('state') in ('success', 'error'):
                      break
                  time.sleep(20)
          assert final.get('state') == 'success', 'Unpublished generation did not complete successfully'
          debug = final.get('debug') or {}
          Path('pilot/debug.json').write_text(json.dumps(debug, ensure_ascii=False, indent=2), encoding='utf8')
          Path('pilot/daily-preview.md').write_text(debug.get('dailyPreviewMarkdown', ''), encoding='utf8')
          assert debug.get('usedCachedDailySourceData') is True, 'Source cache was not reused'
          assert debug.get('dailyPublished') is False, 'Dry-run publication contract missing'
          assert debug.get('dailyWouldPublish') is True, 'Draft failed existing publication checks'
          print('Unpublished preview saved for human editorial review')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-content-density-pilot-20260918
          path: pilot/
          retention-days: 7
